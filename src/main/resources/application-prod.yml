# Activate with SPRING_PROFILES_ACTIVE=prod. Database credentials, JWT secret and CORS origins must be set; no demo data.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

app:
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  seed:
    enabled: false
