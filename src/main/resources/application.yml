server:
  port: ${PORT:8080}

spring:
  application:
    name: oursecurity-be
  datasource:
    url: ${DB_URL:jdbc:h2:mem:oursecurity;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
  h2:
    console:
      enabled: false

app:
  time-zone: ${APP_TIME_ZONE:Asia/Kolkata}
  # How long a pre-approved visitor pass stays valid after its expected time.
  pass-validity: ${PASS_VALIDITY:24h}
  jwt:
    # Dev-only default. Set JWT_SECRET (32+ characters) anywhere real.
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    expiry: ${JWT_EXPIRY:7d}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  seed:
    enabled: ${SEED_DEMO_DATA:true}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
