server:
  port: ${PORT:8080}

spring:
  application:
    name: oursecurity-be
  # PostgreSQL. The defaults match docker-compose.yml, so `docker compose up -d` is all a laptop needs.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/oursecurity}
    username: ${DB_USERNAME:oursecurity}
    password: ${DB_PASSWORD:oursecurity}
  # Tables are created and changed only by the Flyway scripts in src/main/resources/db/migration.
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

app:
  time-zone: ${APP_TIME_ZONE:Asia/Kolkata}
  # How long a pre-approved visitor pass stays valid after its expected time.
  pass-validity: ${PASS_VALIDITY:24h}
  jwt:
    # Dev-only default. Set JWT_SECRET (32+ characters) anywhere real.
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    expiry: ${JWT_EXPIRY:7d}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  seed:
    enabled: ${SEED_DEMO_DATA:true}
  push:
    # expo: send through Expo's push service. log: only log (no network).
    provider: ${PUSH_PROVIDER:expo}
    expo-url: ${EXPO_PUSH_URL:https://exp.host/--/api/v2/push/send}
    # Optional. Only needed if "enhanced push security" is turned on in the Expo project.
    expo-access-token: ${EXPO_ACCESS_TOKEN:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
